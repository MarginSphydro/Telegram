name: Build and Release APK

on:
  release:
    types: [published, created]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release
          - standalone

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create keystore from secret
        if: secrets.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > TMessagesProj/config/release.keystore

      - name: Build APK
        run: |
          if [ "${{ secrets.KEYSTORE_BASE64 }}" != "" ]; then
            ./gradlew :TMessagesProj_App:assembleRelease
            BUILD_TYPE="release"
          else
            ./gradlew :TMessagesProj_App:assembleDebug
            BUILD_TYPE="debug"
          fi
          echo "BUILD_TYPE=$BUILD_TYPE" >> $GITHUB_ENV
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'android' }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'telegram' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
          APP_PACKAGE: 'org.telegram.messenger'

      - name: Get version info
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          if [ "$VERSION" = "refs/heads/master" ] || [ "$VERSION" = "refs/heads/main" ]; then
            VERSION="snapshot-$(date +%Y%m%d)"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "APK_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Find APK file
        id: findapk
        run: |
          APK_PATH=$(find . -name "*.apk" -type f | head -1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "APK 路径: $APK_PATH"

      - name: Rename APK with version
        run: |
          APK_PATH="${{ steps.findapk.outputs.apk_path }}"
          APK_DIR=$(dirname "$APK_PATH")
          APK_NAME=$(basename "$APK_PATH")
          NEW_NAME="telegram-${APK_VERSION}-$(date +%Y%m%d-%H%M%S).apk"
          mv "$APK_PATH" "$APK_DIR/$NEW_NAME"
          echo "FINAL_APK=$APK_DIR/$NEW_NAME" >> $GITHUB_ENV

      - name: Upload APK to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ env.FINAL_APK }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: telegram-apk-${{ steps.version.outputs.version }}
          path: ${{ env.FINAL_APK }}
          retention-days: 90

      - name: Upload to GitHub Releases (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ env.FINAL_APK }}
          tag_name: ${{ steps.version.outputs.version }}
          draft: true
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Generate release notes
        run: |
          echo "# Telegram APK Release" > release_notes.md
          echo "" >> release_notes.md
          echo "**Version:** ${{ steps.version.outputs.version }}" >> release_notes.md
          echo "**Build Date:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> release_notes.md
          echo "**Commit:** ${{ github.sha }}" >> release_notes.md
          echo "" >> release_notes.md
          echo "## Installation" >> release_notes.md
          echo "Download the APK file and install it on your Android device." >> release_notes.md

      - name: Create GitHub Release with notes
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ env.FINAL_APK }}
          body_path: release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
