name: Build and Release APK

on:
  release:
    types: [published]

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create keystore from secret
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > TMessagesProj/config/release.keystore

      - name: Build APK
        run: ./gradlew :TMessagesProj_App:assembleRelease
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'android' }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'telegram' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
          APP_PACKAGE: 'org.telegram.messenger'
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        continue-on-error: true

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v1
        with:
          files: TMessagesProj_App/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
