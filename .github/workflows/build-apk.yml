name: Build and Upload APK

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create keystore for signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Warning: No keystore provided, will build debug APK"
          else
            echo "$KEYSTORE_BASE64" | base64 -d > TMessagesProj/config/release.keystore
          fi

      - name: Build debug APK
        if: success()
        run: ./gradlew :TMessagesProj_App:assembleDebug
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'android' }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'telegram' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
          APP_PACKAGE: 'org.telegram.messenger'

      - name: Build release APK (if keystore available)
        if: success() && env.KEYSTORE_BASE64 != ''
        run: ./gradlew :TMessagesProj_App:assembleRelease
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          APP_PACKAGE: 'org.telegram.messenger'
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        continue-on-error: true

      - name: Build standalone APK
        if: success()
        run: ./gradlew :TMessagesProj_AppStandalone:assembleStandalone
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'android' }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'telegram' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
          APP_PACKAGE: 'org.telegram.messenger.web'
        continue-on-error: true

      - name: Find APK files
        if: success()
        run: |
          echo "Debug APK:"
          find . -name "*.apk" -type f | grep -i debug
          echo ""
          echo "All APK files:"
          find . -name "*.apk" -type f

      - name: Upload debug APK to artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: |
            TMessagesProj_App/build/outputs/apk/debug/*.apk
            TMessagesProj_AppStandalone/build/outputs/apk/standalone/*.apk
          retention-days: 30

      - name: Upload release APK to artifacts
        if: success() && env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: TMessagesProj_App/build/outputs/apk/release/*.apk
          retention-days: 30
        continue-on-error: true
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Create Release with APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            TMessagesProj_App/build/outputs/apk/release/*.apk
            TMessagesProj_App/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Upload to Firebase App Distribution
        if: success() && env.FIREBASE_TOKEN != ''
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          file: TMessagesProj_App/build/outputs/apk/debug/TMessagesProj_App-debug.apk
          groups: testers
          releaseNotes: "Build from commit ${{ github.sha }}"
        continue-on-error: true
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Send notification on success
        if: success()
        run: |
          echo "✅ APK build completed successfully!"
          echo "Artifacts are available in the GitHub Actions workflow."

      - name: Send notification on failure
        if: failure()
        run: |
          echo "❌ APK build failed!"
          echo "Please check the logs for details."
        continue-on-error: true
