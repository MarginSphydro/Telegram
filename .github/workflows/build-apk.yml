name: Build and Upload APK

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create keystore for signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Warning: No keystore provided, will build debug APK"
          else
            echo "$KEYSTORE_BASE64" | base64 -d > TMessagesProj/config/release.keystore
          fi

      - name: Build debug APK (optimized)
        if: success()
        run: |
          ./gradlew \
            :TMessagesProj_App:assembleDebug \
            --parallel \
            --max-workers=8 \
            -Dorg.gradle.jvmargs="-Xmx4096m" \
            -Dorg.gradle.vfs.watch=false \
            --build-cache \
            -x lint
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'android' }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'telegram' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
          APP_PACKAGE: 'org.telegram.messenger'

      - name: Find APK files
        if: success()
        run: |
          echo "Debug APK found:"
          find . -name "*.apk" -type f | grep -i debug || echo "No debug APK found"
          echo ""
          echo "All APK files:"
          find . -name "*.apk" -type f

      - name: Upload debug APK to artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: |
            TMessagesProj_App/build/outputs/apk/afat/debug/*.apk
          retention-days: 30
        continue-on-error: true

      - name: Send notification on success
        if: success()
        run: |
          echo "✅ APK build completed successfully!"
          echo "Artifacts are available in the GitHub Actions workflow."

      - name: Send notification on failure
        if: failure()
        run: |
          echo "❌ APK build failed!"
          echo "Please check the logs for details."
        continue-on-error: true
